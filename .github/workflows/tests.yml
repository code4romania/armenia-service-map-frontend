name: Tests

on:
  push:
  merge_group:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Node.js dependencies
        run: npm ci --no-audit --ignore-scripts

      - name: Build assets
        run: npm run build

      - name: Run tests
        run: npm run test
